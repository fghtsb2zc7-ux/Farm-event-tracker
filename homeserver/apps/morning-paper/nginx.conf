server {
  listen 127.0.0.1:8080;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self' https: data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
  location ~ \.epub$ { types { application/epub+zip epub; } add_header Content-Disposition inline always; add_header X-Content-Type-Options nosniff always; }
  location ~ /\. { deny all; }
}
