# Morning Paper: builder (scheduled, no ports) + read-only web page on its own private
# Tailscale name. Tailnet only: no Funnel, no Cloudflare, no published host port.
# On the Mac mini, match the existing Tailscale sidecar pattern used by the other apps.
name: morning-paper

services:
  builder:
    build: .
    image: morning-paper-builder:1.0.0
    restart: unless-stopped
    env_file: ${HOME}/ServerData/secrets/morning-paper/paper.env
    environment:
      TZ: America/Toronto
      BUILD_AT: "06:00"
      DELIVER_AT: "06:30"
    volumes:
      - ${HOME}/ServerData/morning-paper:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  tailscale:
    image: tailscale/tailscale:v1.90.6
    hostname: paper
    restart: unless-stopped
    env_file: ${HOME}/ServerData/secrets/tailscale/authkey.env   # TS_AUTHKEY=...
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ${HOME}/ServerData/morning-paper/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - ${HOME}/ServerData/morning-paper/site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
