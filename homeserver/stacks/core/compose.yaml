# core: the building blocks every other service relies on.
#   ntfy          phone alerts      https://ntfy.taild086ea.ts.net    (private to your devices)
#   uptime-kuma   status page       https://status.taild086ea.ts.net  (private to your devices)
#   authelia      sign-in (password + 2nd step) for everything behind caddy
#   caddy         the public front door  https://apps.taild086ea.ts.net  (on the internet, sign-in required)
#   media         Tailscale address for Jellyfin  https://media.taild086ea.ts.net  (private; Jellyfin itself runs
#                 on the Mac, not in Docker: homeserver/scripts/enable-jellyfin.sh)
# Each has its own Tailscale sidecar. Start with: bash homeserver/scripts/stack.sh up core

services:
  ntfy-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: ntfy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${SERVERDATA}/ntfy/tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve-ntfy.json:/config/serve.json:ro
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.29.0
    command: serve
    network_mode: service:ntfy-tailscale
    environment:
      NTFY_BASE_URL: https://ntfy.taild086ea.ts.net
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh       # lets iPhones get alerts instantly (Apple push)
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      TZ: America/Toronto
    volumes:
      - ${SERVERDATA}/ntfy/data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  status-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: status
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"            # a real network link, so the status page can check the other private addresses
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - ${SERVERDATA}/uptime-kuma/tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve-status.json:/config/serve.json:ro
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    network_mode: service:status-tailscale
    environment:
      TZ: America/Toronto
    volumes:
      - ${SERVERDATA}/uptime-kuma/data:/app/data
    restart: unless-stopped

  # ---- The public front door and its sign-in (docs/ACCESS.md) ----
  authelia:
    image: authelia/authelia:4.39.28
    environment:
      TZ: America/Toronto
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /smtp-password
    volumes:
      - ${STACK_CONFIG}/authelia/configuration.yml:/config/configuration.yml:ro
      - ${SERVERDATA}/authelia/data:/data                       # people, 2nd-step devices, sessions
      - ${SERVERDATA}/secrets/authelia:/secrets:ro
      - ${SERVERDATA}/secrets/msmtp-password:/smtp-password:ro
    restart: unless-stopped

  apps-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: apps
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${SERVERDATA}/apps/tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve-apps.json:/config/serve.json:ro   # AllowFunnel: true (public)
    networks: [default, web]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    network_mode: service:apps-tailscale
    volumes:
      - ${STACK_CONFIG}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SERVERDATA}/apps/caddy-data:/data
    restart: unless-stopped

  media-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: media
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${SERVERDATA}/media-tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve-media.json:/config/serve.json:ro  # to Jellyfin on the Mac (host.lima.internal:8096)
    restart: unless-stopped

networks:
  # Web apps in other stacks (homeserver/stacks/webapps) join this network so caddy can reach them.
  web:
    name: homeserver-web
