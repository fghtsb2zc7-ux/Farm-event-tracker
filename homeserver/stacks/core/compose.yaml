# core: the building blocks every other service relies on.
#   ntfy          phone alerts      https://ntfy.taild086ea.ts.net    (private to your devices)
#   uptime-kuma   status page       https://status.taild086ea.ts.net  (private to your devices)
# Each has its own Tailscale sidecar. Start with: bash homeserver/scripts/stack.sh up core

services:
  ntfy-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: ntfy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${SERVERDATA}/ntfy/tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve-ntfy.json:/config/serve.json:ro
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.29.0
    command: serve
    network_mode: service:ntfy-tailscale
    environment:
      NTFY_BASE_URL: https://ntfy.taild086ea.ts.net
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh       # lets iPhones get alerts instantly (Apple push)
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      TZ: America/Toronto
    volumes:
      - ${SERVERDATA}/ntfy/data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  status-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: status
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"            # a real network link, so the status page can check the other private addresses
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - ${SERVERDATA}/uptime-kuma/tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve-status.json:/config/serve.json:ro
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    network_mode: service:status-tailscale
    environment:
      TZ: America/Toronto
    volumes:
      - ${SERVERDATA}/uptime-kuma/data:/app/data
    restart: unless-stopped
