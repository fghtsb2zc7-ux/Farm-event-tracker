# vault: Vaultwarden, the password manager (works with the official Bitwarden apps). See docs/VAULT.md.
# PRIVATE ONLY: https://vault.taild086ea.ts.net, reachable from your own Tailscale devices.
# Never public (no Funnel, never behind the apps.taild086ea.ts.net front door).
# - No sign-ups: people join by invitation (admin page: https://vault.taild086ea.ts.net/admin).
# - The admin password is stored only as an Argon2 hash: ~/ServerData/secrets/vault/admin-token-hash.
# - Data: ~/ServerData/vault/data. Backed up every hour (homeserver/backup/vault-backup.sh) and every night.
# - Never updated automatically (NO_AUTO_UPDATE in services.sh): read the release notes first.

services:
  vault-tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: vault
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${SERVERDATA}/vault/tailscale:/var/lib/tailscale
      - ${STACK_CONFIG}/serve.json:/config/serve.json:ro     # "AllowFunnel": false
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:1.37.4
    network_mode: service:vault-tailscale
    environment:
      DOMAIN: https://vault.taild086ea.ts.net
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      ADMIN_TOKEN_FILE: /run/secrets/admin-token-hash
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURITY: starttls
      SMTP_FROM: fehrkieran11@gmail.com
      SMTP_FROM_NAME: Fehr Home passwords
      SMTP_USERNAME: fehrkieran11@gmail.com
      SMTP_PASSWORD_FILE: /run/secrets/smtp-password
      ROCKET_PORT: "80"
      TZ: America/Toronto
    volumes:
      - ${SERVERDATA}/vault/data:/data
      - ${SERVERDATA}/secrets/vault/admin-token-hash:/run/secrets/admin-token-hash:ro
      - ${SERVERDATA}/secrets/msmtp-password:/run/secrets/smtp-password:ro
    restart: unless-stopped
