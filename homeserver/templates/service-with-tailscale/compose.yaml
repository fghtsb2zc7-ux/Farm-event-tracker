# Template: one app plus its own Tailscale "sidecar", so the app gets its own private address,
# https://<name>.taild086ea.ts.net, reachable from your devices that are signed in to Tailscale.
# Copy this folder to homeserver/stacks/<stack>/ and replace every "myapp".
# Always use a version tag for images, never "latest".

services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    hostname: myapp                                   # becomes https://myapp.taild086ea.ts.net
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run this stack with homeserver/scripts/stack.sh}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${SERVERDATA}/myapp/tailscale:/var/lib/tailscale     # its Tailscale identity (keep it)
      - ${STACK_CONFIG}/serve.json:/config/serve.json:ro      # copied from config/ by stack.sh
    restart: unless-stopped

  app:
    image: traefik/whoami:v1.12.0                     # the real app's image and version
    network_mode: service:tailscale                   # shares the sidecar's network; serve.json points at its port
    volumes:
      - ${SERVERDATA}/myapp/data:/data                # the app's own files, inside ~/ServerData (backed up nightly)
    restart: unless-stopped
